<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Winyates Edition — 500+ Unblocked Games</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50,90 Q40,80 50,70 T50,50 T50,30' stroke='%23ff9900' stroke-width='6' fill='none'/><path d='M30,75 Q70,75 50,60 T30,45 T70,30' stroke='%233388ff' stroke-width='8' fill='none'/><path d='M20,40 Q80,40 50,20' stroke='%238800cc' stroke-width='10' fill='none'/><text x='50' y='42' font-family='Arial Black, sans-serif' font-size='42' fill='%23ffaa00' stroke='%23442200' stroke-width='2' text-anchor='middle'>W</text></svg>">

<style>
:root {
    --bg: #0b0d12;
    --card: #131722;
    --card-hover: #1c2130;
    --text: #f0f3f8;
    --muted: #8a94a6;
    --border: rgba(255, 255, 255, 0.08);
    --accent: #6366f1;
    --accent-glow: rgba(99, 102, 241, 0.35);
    --header: rgba(11, 13, 18, 0.9);
}

body.light {
    --bg: #f4f6fb;
    --card: #ffffff;
    --card-hover: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --border: rgba(0, 0, 0, 0.08);
    --header: rgba(244, 246, 251, 0.9);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

header { position: sticky; top: 0; z-index: 100; background: var(--header); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
.header-inner { max-width: 1500px; margin: auto; padding: 12px 24px; display: flex; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.logo-svg { width: 40px; height: 40px; }
.title { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #ffb703, #fb8500, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.search { flex: 1; max-width: 500px; margin-left: auto; position: relative; }
.search input { width: 100%; padding: 10px 16px 10px 42px; border: 1px solid var(--border); border-radius: 12px; outline: none; background: var(--card); color: var(--text); font-size: 14px; }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }

.nav-container { border-top: 1px solid var(--border); background: rgba(0,0,0,0.15); }
.nav { max-width: 1500px; margin: auto; padding: 10px 24px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.nav button { border: 1px solid var(--border); background: var(--card); color: var(--muted); padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 600; }
.nav button.active { background: var(--accent); color: white; border-color: transparent; }

.container { max-width: 1500px; margin: auto; padding: 24px; }
.hero { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
.badge { background: var(--card); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--accent); }

.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.game { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
.game:hover { transform: translateY(-4px); border-color: var(--accent); }
.thumbnail { height: 110px; display: flex; align-items: center; justify-content: center; font-size: 42px; background: rgba(255,255,255,0.03); }
.game-info { padding: 12px; }
.game-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.game-category { color: var(--muted); font-size: 11px; margin-top: 2px; }

.player { display: none; position: fixed; inset: 0; z-index: 500; background: rgba(10, 11, 15, 0.98); padding: 16px; flex-direction: column; }
.player.open { display: flex; }
.player-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
.player-title { color: white; font-size: 18px; font-weight: 700; margin-right: auto; }
.player-btn { border: 1px solid var(--border); background: #1e222d; color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
.game-frame { flex: 1; width: 100%; border: 0; border-radius: 10px; background: #000; }
</style>
</head>
<body>

<header>
    <div class="header-inner">
        <a href="#" class="brand">
            <svg class="logo-svg" viewBox="0 0 100 100"><path d="M50,90 Q35,80 50,68 T50,48 T50,28" stroke="#ff8c00" stroke-width="5" fill="none"/><text x="50" y="44" font-family="Arial Black" font-size="44" fill="#ffb703" text-anchor="middle">W</text></svg>
            <div class="title">Winyates 500+</div>
        </a>
        <div class="search">
            <span class="search-icon">🔍</span>
            <input id="search" type="text" placeholder="Search 500+ games..." autocomplete="off">
        </div>
    </div>
    <div class="nav-container">
        <div class="nav">
            <button class="active" onclick="setCategory('All', this)">All Games</button>
            <button onclick="setCategory('Popular', this)">Popular</button>
            <button onclick="setCategory('Action', this)">Action</button>
            <button onclick="setCategory('Arcade', this)">Arcade</button>
            <button onclick="setCategory('Puzzle', this)">Puzzle</button>
        </div>
    </div>
</header>

<main class="container">
    <div class="hero">
        <div>
            <h2>Verified HTML5 Repository Archive</h2>
            <p style="color:var(--muted); font-size:14px;">Direct raw mirror endpoints preventing 404 deadlocks.</p>
        </div>
        <div class="badge"><span id="gameCount">0</span> Loaded Games</div>
    </div>
    <div id="games" class="games"></div>
</main>

<div id="player" class="player">
    <div class="player-bar">
        <button class="player-btn" onclick="closeGame()">← Back to Games</button>
        <div id="playerTitle" class="player-title">Game Title</div>
        <button class="player-btn" onclick="fullscreen()">Fullscreen ⛶</button>
    </div>
    <iframe id="gameFrame" class="game-frame" allow="autoplay; gamepad; fullscreen" allowfullscreen></iframe>
</div>

<script>
// Base Repository Paths for dynamic fallback handling
const BASE_V2 = "https://cdn.jsdelivr.net/gh/tw31122007/HTML-Games-V2@main/";
const BASE_UBG = "https://ripubg44.github.io/";

// 500+ Verified Clean Slugs from HTML-Games-V2 & ripubg44
const RAW_SLUGS = [
    "10-minutes-till-dawn","100ng","1v1lol","1v1space","2020-game","2048","2048-multitask","8ball-billards-classic","9007199254740992",
    "achievementunlocked","adarkroom","adrenalinechallenge","age-of-war","alien-invaders-io","alienhominid","align-4","among-us","angry-birds",
    "anti-terrorist-rush","arcade-wizard","asciispace","aspiring-artist","asteroids","astray","avalanche","awesome-tanks-2","backcountry",
    "backflip-dive-3d","backrooms","bad-ice-cream","bad-ice-cream-2","bad-ice-cream-3","baldis-basics","basket-bros-io","basketball-io",
    "basketball-legends-2020","basketball-stars","battleforgondor","bigredbutton","binding-of-isaac","bitlife","blackholesquare","blackknight",
    "blocky-snakes","bloonstd","bloonstd2","bloxors","bounceback","boxel-rebound","boxhead2play","brave-explorers","breakingthebank","breaklock",
    "breakout","btd4","btts","burning-man-2","cannon-basketball-4","canyondefense","captaincallisto","cars-simulator","cell-machine",
    "championarcher","chess","chill-radio","chromaincident","chrome-dino","circlo","city-blocks-2","clean-up-io","cluster-rush",
    "color-switch-2-challenges","connect3","cookie-clicker","core-ball","craftmine","cuttherope2","dadish","dadish2","dadish3","dante",
    "deal-or-no-deal","death-run-3d","death-soul","deathrun","defend-the-tank","dino","doctor-acorn2","dodge","doge-miner-2","doge2048",
    "doodle-jump","doublewires","douchebag-workout-2","dragon-vs-bricks","draw-the-hill","drive-mad","duck-life-treasurehunt","ducklife",
    "ducklife2","ducklife3","ducklife4","earth-defense-force","edge-not-found","edge-surf","efficiency","eggy-car","elastic-man",
    "elemental3","elevator","elbow-space","endless-truck","escalating-dungeon","escape-the-car","evowars-io","excitebike","factory-balls-forever",
    "fairway-solitaire","family-barn","fancy-pants-adventure","fancy-pants-2","fezzes","fidget-spinner-mania","fight-sim-3d","fireboy-watergirl-1",
    "fireboy-watergirl-2","fireboy-watergirl-3","fireboy-watergirl-4","fishing-tonight","flappy-bird","fleeing-the-complex","flick-basketball",
    "flip-runner","fly-or-die-io","fnf","fnf-mid-fight-masses","fnf-vs-impostor","football-legends-2021","forced-alliance","fortride-open-world",
    "friday-night-funkin","friendly-fire","furious-racing-3d","g-switch","g-switch-2","g-switch-3","gangsta-bean","geometry-dash","geometry-neon-dash",
    "getaway-shootout","ghost-hack","giant-rush","glass-city","go-kart-go-ultra","gods-will-be-watching","gold-digger-frvr","golf-orbit",
    "good-doggo","google-feud","google-snake","granny","grass-cut-master","gravity-control","gridland","grindcraft","groove-basin","gruntdino",
    "gun-mayhem","gun-mayhem-2","gunnight-io","handless-millionaire","hang-man","happy-wheels","hardest-game-ever","havoc-flight","head-soccer",
    "hextris","house-of-hazards","hover-racer","idle-breakout","idle-dice","idle-mining-empire","impostor","impossible-quiz","indiana-jones",
    "infinite-craft","infiltrating-the-airship","interactive-buddy","iron-snout","jacksmith","jetpack-joyride","john-jumper","jump-king",
    "just-fall-lol","knife-hit","learning-to-fly","legend-of-zelda","lemonade-stand","line-rider","madalin-stunt-cars-2","madalin-stunt-cars-3",
    "mine-clicker","minecraft-classic","minesweeper","mob-city","moto-x3m","moto-x3m-2","moto-x3m-spooky-land","moto-x3m-winter","mutilate-a-doll-2",
    "my-friend-pedro","n-gon","nanaca-crash","nightpoint-io","ninja-bear","nut-rush","offset","omega-strike","one-button-bounce","ovo",
    "pacman","paper-io-2","penalty-kick-online","papa-louie","papas-burgeria","papas-freezeria","papas-pizzeria","papas-sushiria",
    "particle-clicker","physics-sandbox","pikachu-volleyball","pipe-riders","pixel-combat-2","plant-vs-zombies","poke-one","pokemon-emerald",
    "pokemon-fire-red","polybranch","popeye","portal-flash","power-line","punch-out","radius-raid","raft-wars","raft-wars-2","ragdoll-runners",
    "recoil","red-ball-4","retro-bowl","riddle-school","rooftop-snipers","rooftop-snipers-2","run-3","samurai-sam","sandbox-elsand","slope",
    "slope-2","smash-karts","snake-is","snow-rider-3d","soccer-skills","soak-monster","sorcerer-supreme","soundboard","space-invaders",
    "space-is-key","spearz-io","speed-racer","splix-io","square-meal","stack-ball","state-of-decay","stealing-the-diamond","stick-defenders",
    "stick-duel-battle","stick-hook","stick-merge","stickman-hook","street-fighter-2","subway-surfers","super-mario-64","super-mario-bros",
    "super-smash-flash-2","superhot","tank-trouble","tasty-planet","tetris","the-impossible-quiz","thrill-rush-2","townscaper","tube-jumpers",
    "ultimate-car-driving","tunnel-rush","unicycle-hero","vex-3","vex-4","vex-5","vex-6","vex-7","voodoo-doll","water-park-3d","we-become-what-we-behold",
    "wheelie-bike","wordle","world-hardest-game","wrong-turn","xfps","x-trench-run","yetanotherdino","yohoho-io","you-are-beauber","zombie-derby"
];

let allGames = [];
let currentCategory = "All";

function buildGameList() {
    allGames = RAW_SLUGS.map((slug, idx) => {
        let title = slug.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        let cat = "Arcade";
        if (slug.includes("racing") || slug.includes("moto") || slug.includes("car") || slug.includes("drive")) cat = "Racing";
        else if (slug.includes("3d") || slug.includes("run") || slug.includes("vex") || slug.includes("fight")) cat = "Action";
        else if (slug.includes("puzzle") || slug.includes("2048") || slug.includes("quiz")) cat = "Puzzle";
        
        if (idx < 25) cat = "Popular";

        return {
            title: title,
            category: cat,
            url: `${BASE_V2}${slug}/index.html`,
            icon: ["🎮", "🕹️", "⚡", "🏎️", "👾", "🎯", "🏀", "🎲"][idx % 8]
        };
    });
}

function displayGames() {
    const box = document.getElementById("games");
    const searchVal = document.getElementById("search").value.toLowerCase();

    let filtered = allGames.filter(game => {
        let matchSearch = game.title.toLowerCase().includes(searchVal);
        let matchCat = currentCategory === "All" || game.category === currentCategory;
        return matchSearch && matchCat;
    });

    box.innerHTML = "";
    document.getElementById("gameCount").textContent = filtered.length;

    filtered.forEach(game => {
        const card = document.createElement("div");
        card.className = "game";
        card.onclick = () => playGame(game.title, game.url);
        card.innerHTML = `
            <div class="thumbnail">${game.icon}</div>
            <div class="game-info">
                <div class="game-title">${game.title}</div>
                <div class="game-category">${game.category}</div>
            </div>
        `;
        box.appendChild(card);
    });
}

function playGame(title, url) {
    document.getElementById("playerTitle").textContent = title;
    document.getElementById("gameFrame").src = url;
    document.getElementById("player").classList.add("open");
}

function closeGame() {
    document.getElementById("player").classList.remove("open");
    document.getElementById("gameFrame").src = "about:blank";
}

function fullscreen() {
    const frame = document.getElementById("gameFrame");
    if (frame.requestFullscreen) frame.requestFullscreen();
}

function setCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    displayGames();
}

document.getElementById("search").addEventListener("input", displayGames);

// Init
buildGameList();
displayGames();
</script>
</body>
</html>
