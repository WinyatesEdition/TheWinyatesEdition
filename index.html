<style>
:root{--text:#171717;--muted:#737373;--line:#e7e7e7;--soft:#f6f6f6;--accent:#111;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.top{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5.2%;gap:28px;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);z-index:30}
.logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.logo img{width:44px;height:44px;object-fit:contain}
.categories{display:flex;gap:24px;align-items:center;overflow:auto;flex:1;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.categories button{border:0;background:none;color:#202020;padding:7px 0;white-space:nowrap}
.categories button.active{font-weight:700}
.tools{display:flex;gap:8px}
.tool{height:40px;width:40px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:19px;display:grid;place-items:center}
.wrap{width:min(1440px,90%);margin:auto}
.hero{padding:54px 0 25px}
.hero h1{font-size:clamp(42px,6vw,74px);letter-spacing:-4px;line-height:.98;margin:0 0 13px}
.hero p{margin:0;color:#737373;font-size:17px}
.searchbar{height:54px;border:1px solid #dcdcdc;border-radius:15px;margin-top:28px;display:flex;align-items:center;padding:0 16px;max-width:850px;box-shadow:0 2px 13px rgba(0,0,0,.035)}
.searchbar span{font-size:23px;color:#777}
.searchbar input{border:0;outline:0;flex:1;padding:0 12px;font-size:16px;background:transparent}
.searchbar kbd{border:1px solid #ddd;background:#f7f7f7;border-radius:6px;padding:3px 7px;font-size:11px;color:#888}
.head{display:flex;align-items:center;justify-content:space-between;margin:29px 0 15px}
.head h2{font-size:25px;letter-spacing:-.7px;margin:0}
.head .total{color:#888;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:17px;padding-bottom:65px}
.card{min-width:0;border:1px solid #e3e3e3;border-radius:17px;overflow:hidden;background:#fff;transition:transform .16s,box-shadow .16s;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(0,0,0,.09)}
.cover{height:153px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0f0f0,#fafafa)}
.cover::before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.28);left:-85px;top:-105px}
.cover::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(0,0,0,.05);right:-85px;bottom:-110px}
.cover .letter{font-size:58px;font-weight:900;letter-spacing:-5px;position:relative;z-index:1}
.fs{position:absolute;right:9px;top:9px;width:35px;height:35px;border:1px solid rgba(255,255,255,.75);background:rgba(20,20,20,.62);color:#fff;border-radius:10px;display:grid;place-items:center;font-size:17px;z-index:3}
.info{padding:12px 13px 14px}
.game-name{font-weight:700;font-size:14px;line-height:1.25;min-height:35px}
.tag{display:inline-block;margin-top:7px;font-size:11px;color:#777;background:#f5f5f5;border-radius:7px;padding:4px 7px}
.empty{grid-column:1/-1;text-align:center;padding:80px 0;color:#777}
.footer{border-top:1px solid var(--line);padding:30px 0 45px;color:#888;font-size:12px}
#viewer{position:fixed;inset:0;background:#111;z-index:100;display:none}
.viewerbar{height:58px;background:#171717;color:white;display:flex;align-items:center;padding:0 13px;gap:11px}
.viewerbar .title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.viewerbar button{border:1px solid #404040;background:#252525;color:#fff;border-radius:9px;padding:8px 12px}
.gamebox{height:calc(100vh - 58px);padding:12px;background:#0d0d0d}
.gamebox-inner{height:100%;width:100%;border-radius:16px;overflow:hidden;background:#000;position:relative}
#gameframe{width:100%;height:100%;border:0;background:#000}
.setup{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#111,#222);text-align:center;padding:30px}
.setup div{max-width:540px}
.setup h3{font-size:27px;margin:0 0 9px}
.setup p{color:#bbb;line-height:1.5}
@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:820px){.top{padding:0 4%;height:68px}.categories{display:none}.wrap{width:92%}.grid{grid-template-columns:repeat(3,1fr)}.hero h1{letter-spacing:-2.5px}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.cover{height:125px}.cover .letter{font-size:46px}.hero{padding-top:38px}}
</style>

ry": "Racing", "path": "games/survival-race/index.html"}, {"name": "Yohoho.io", "category": "2-Player", "path": "games/yohoho-io/index.html"}];
const cats=["Popular","Action","Arcade","Racing","Sports","Horror","2-Player","All Games"];
let active="Popular";

const catBox=document.getElementById("categories");
cats.forEach(c=>{
  const b=document.createElement("button");
  b.textContent=c;
  b.onclick=()=>{active=c;render()};
  catBox.appendChild(b);
});

function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  let list=games.filter(g=>{
    const catOk=active==="All Games" || (active==="Popular" ? ["Popular","Action","Arcade","Racing","Sports"].includes(g.category) : g.category===active);
    return catOk && (!q || g.name.toLowerCase().includes(q));
  });
  document.getElementById("heading").textContent=q ? "Search Results" : active==="All Games" ? "All Games" : active+" Games";
  document.getElementById("total").textContent=list.length+" games";
  document.querySelectorAll(".categories button").forEach(b=>b.classList.toggle("active",b.textContent===active));
  const grid=document.getElementById("grid"); grid.innerHTML="";
  if(!list.length){grid.innerHTML='<div class="empty">No games found.</div>';return}
  list.forEach(g=>{
    const card=document.createElement("article"); card.className="card";
    const letter=escapeHTML(g.name.replace(/[^A-Za-z0-9]/g,"").slice(0,1).toUpperCase() || "W");
    card.innerHTML=`<div class="cover"><div class="letter">${letter}</div><button class="fs" title="Open fullscreen">⛶</button></div><div class="info"><div class="game-name">${escapeHTML(g.name)}</div><span class="tag">${escapeHTML(g.category)}</span></div>`;
    card.onclick=()=>openGame(g);
    card.querySelector(".fs").onclick=e=>{e.stopPropagation();openGame(g);setTimeout(fullscreenGame,120)};
    grid.appendChild(card);
  });
}

function openGame(g){
  document.getElementById("viewer").style.display="block";
  document.getElementById("viewerTitle").textContent=g.name;
  document.getElementById("setupTitle").textContent=g.name;
  document.body.style.overflow="hidden";
  const frame=document.getElementById("gameframe");
  const setup=document.getElementById("setup");
  frame.src=g.path;
  setup.style.display="none";
  frame.onerror=()=>setup.style.display="grid";
}
function closeGame(){
  document.getElementById("gameframe").src="about:blank";
  document.getElementById("viewer").style.display="none";
  document.body.style.overflow="";
}
function fullscreenGame(){
  const el=document.querySelector(".gamebox-inner");
  if(document.fullscreenElement) document.exitFullscreen?.();
  else el.requestFullscreen?.();
}
function fullscreenPage(){
  if(document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.();
}
function focusSearch(){document.getElementById("search").focus()}
function escapeHTML(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
document.getElementById("search").addEventListener("input",render);
document.addEventListener("keydown",e=>{
  if(e.key==="/" && document.activeElement.tagName!=="INPUT"){e.preventDefault();focusSearch()}
  if(e.key==="Escape" && document.getElementById("viewer").style.display==="block")closeGame();
});
render();
</script>
