<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Winyates Edition — Web Arcade</title>
<style>
:root {
    --bg: #0b0e14;
    --card: #151922;
    --card-hover: #1e2430;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.08);
    --accent: #6366f1;
    --accent-hover: #4f46e5;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

header { position: sticky; top: 0; z-index: 100; background: rgba(11, 14, 20, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #ff9900, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.search-box input { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 8px; width: 250px; outline: none; }
.search-box input:focus { border-color: var(--accent); }

.container { max-width: 1400px; margin: auto; padding: 24px; width: 100%; flex: 1; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 20px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s; }
.card:hover { transform: translateY(-4px); border-color: var(--accent); background: var(--card-hover); }
.card-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
.card-tag { font-size: 12px; color: var(--muted); }

/* PAGINATION */
.pagination { display: flex; justify-content: center; gap: 8px; margin-top: 24px; }
.page-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 6px; cursor: pointer; }
.page-btn.active { background: var(--accent); border-color: transparent; }

/* MODAL DISPLAY */
.modal { display: none; position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.9); flex-direction: column; padding: 16px; }
.modal.open { display: flex; }
.modal-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.close-btn { background: #ef4444; color: white; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
.game-viewport { flex: 1; width: 100%; height: 100%; border: 0; background: #000; border-radius: 8px; }
</style>
</head>
<body>

<header>
    <div class="logo">Winyates Edition</div>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search titles..." oninput="filterGames()">
    </div>
</header>

<main class="container">
    <h2>Client-Rendered Game Engine</h2>
    <div id="gameGrid" class="grid"></div>
    <div id="pagination" class="pagination"></div>
</main>

<div id="gameModal" class="modal">
    <div class="modal-bar">
        <h3 id="modalTitle">Game View</h3>
        <button class="close-btn" onclick="closeGame()">Close Game ✕</button>
    </div>
    <iframe id="gameFrame" class="game-viewport" allow="autoplay; gamepad; fullscreen" sandbox="allow-scripts allow-same-origin"></iframe>
</div>

<script>
// NATIVE INLINE GAMES (Resolves CORS and eliminates external 404 dependencies)
const CATALOG = [
    {
        title: "Pong Engine",
        category: "Arcade",
        code: `<!DOCTYPE html><html><body style="margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;"><canvas id="c" width="600" height="400"></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');let py=160,by=200,bx=300,dx=4,dy=4;c.onmousemove=e=>py=e.clientY-c.getBoundingClientRect().top-40;setInterval(()=>{bx+=dx;by+=dy;if(by<0||by>400)dy=-dy;if(bx>600)dx=-dx;if(bx<20&&by>py&&by<py+80)dx=-dx;if(bx<0){bx=300;by=200;}x.fillStyle='#000';x.fillRect(0,0,600,400);x.fillStyle='#fff';x.fillRect(10,py,10,80);x.beginPath();x.arc(bx,by,6,0,7);x.fill();},1000/60);<\/script><\/html>`
    },
    {
        title: "Canvas Snake",
        category: "Classic",
        code: `<!DOCTYPE html><html><body style="margin:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh;"><canvas id="c" width="400" height="400"></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');let s=[{x:10,y:10}],f={x:15,y:10},dx=1,dy=0;document.onkeydown=e=>{if(e.key==='ArrowUp'&&dy===0){dx=0;dy=-1;}if(e.key==='ArrowDown'&&dy===0){dx=0;dy=1;}if(e.key==='ArrowLeft'&&dx===0){dx=-1;dy=0;}if(e.key==='ArrowRight'&&dx===0){dx=1;dy=0;}};setInterval(()=>{let h={x:s[0].x+dx,y:s[0].y+dy};if(h.x<0||h.x>=20||h.y<0||h.y>=20){s=[{x:10,y:10}];dx=1;dy=0;return;}s.unshift(h);if(h.x===f.x&&h.y===f.y){f={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};}else{s.pop();}x.fillStyle='#111';x.fillRect(0,0,400,400);x.fillStyle='red';x.fillRect(f.x*20,f.y*20,18,18);x.fillStyle='lime';s.forEach(p=>x.fillRect(p.x*20,p.y*20,18,18));},120);<\/script><\/html>`
    }
];

let currentPage = 1;
const itemsPerPage = 8;

function renderGrid() {
    const grid = document.getElementById("gameGrid");
    const search = document.getElementById("searchInput").value.toLowerCase();
    grid.innerHTML = "";

    const filtered = CATALOG.filter(g => g.title.toLowerCase().includes(search));
    const start = (currentPage - 1) * itemsPerPage;
    const paginated = filtered.slice(start, start + itemsPerPage);

    paginated.forEach(game => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => loadGame(game);
        card.innerHTML = `<div class="card-title">${game.title}</div><div class="card-tag">${game.category}</div>`;
        grid.appendChild(card);
    });

    renderPagination(filtered.length);
}

function renderPagination(totalItems) {
    const pContainer = document.getElementById("pagination");
    pContainer.innerHTML = "";
    const pages = Math.ceil(totalItems / itemsPerPage);

    for (let i = 1; i <= pages; i++) {
        const btn = document.createElement("button");
        btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        btn.textContent = i;
        btn.onclick = () => { currentPage = i; renderGrid(); };
        pContainer.appendChild(btn);
    }
}

function filterGames() {
    currentPage = 1;
    renderGrid();
}

function loadGame(game) {
    document.getElementById("modalTitle").textContent = game.title;
    const frame = document.getElementById("gameFrame");
    frame.srcdoc = game.code;
    document.getElementById("gameModal").classList.add("open");
}

function closeGame() {
    document.getElementById("gameModal").classList.remove("open");
    document.getElementById("gameFrame").srcdoc = "";
}

renderGrid();
</script>
</body>
</html>
