<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Winyates Edition</title>

<meta name="description" content="The Winyates Edition - games, arcade, racing, sports and more.">

<link rel="icon" href="logo.png">

<style>

:root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #151515;
    --muted: #777;
    --border: #e4e4e4;
    --accent: #5865f2;
    --header: rgba(255,255,255,.9);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: .2s;
}

body.dark {
    --bg: #101114;
    --card: #18191d;
    --text: #f4f4f4;
    --muted: #999;
    --border: #292b30;
    --header: rgba(18,19,23,.94);
}

/* HEADER */

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--header);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid var(--border);
}

.header-inner {
    max-width: 1500px;
    margin: auto;
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 18px;
}

.logo {
    width: 48px;
    height: 48px;
    border-radius: 13px;
    object-fit: cover;
}

.title {
    font-size: 21px;
    font-weight: 800;
    white-space: nowrap;
}

.search {
    flex: 1;
    max-width: 600px;
    margin-left: auto;
}

.search input {
    width: 100%;
    padding: 13px 17px;
    border: 1px solid var(--border);
    border-radius: 13px;
    outline: none;
    background: var(--card);
    color: var(--text);
    font-size: 15px;
}

.header-button {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    width: 45px;
    height: 45px;
    border-radius: 13px;
    cursor: pointer;
    font-size: 18px;
}

.header-button:hover {
    transform: translateY(-1px);
}

/* NAV */

.nav {
    max-width: 1500px;
    margin: auto;
    padding: 10px 22px 14px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
}

.nav button {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 9px 15px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
}

.nav button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
}

/* HERO */

.hero {
    max-width: 1500px;
    margin: 0 auto;
    padding: 30px 22px 10px;
}

.hero h1 {
    margin: 0 0 6px;
    font-size: 34px;
}

.hero p {
    color: var(--muted);
    margin: 0;
}

.stats {
    margin-top: 16px;
    color: var(--muted);
    font-size: 14px;
}

/* GAMES */

.container {
    max-width: 1500px;
    margin: auto;
    padding: 20px 22px 60px;
}

.games {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 17px;
}

.games.small {
    grid-template-columns: repeat(6, minmax(0, 1fr));
}

.games.large {
    grid-template-columns: repeat(4, minmax(0, 1fr));
}

/* CARD */

.game {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    transition: .18s;
    min-width: 0;
}

.game:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0,0,0,.12);
}

.thumbnail {
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    background: linear-gradient(135deg,#5865f2,#7c4dff);
    color: white;
}

.game-info {
    padding: 13px;
}

.game-title {
    font-size: 16px;
    font-weight: 750;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.game-category {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
}

.play {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 11px;
    background: rgba(0,0,0,.72);
    color: white;
    cursor: pointer;
    font-size: 15px;
}

.favorite {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 35px;
    height: 35px;
    border: 0;
    border-radius: 10px;
    background: rgba(0,0,0,.55);
    color: white;
    cursor: pointer;
}

/* PLAYER */

.player {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(0,0,0,.92);
    padding: 25px;
}

.player.open {
    display: flex;
    flex-direction: column;
}

.player-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 12px;
}

.player-title {
    color: white;
    font-weight: bold;
    margin-right: auto;
}

.player-button {
    border: 0;
    background: #22242a;
    color: white;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
}

.game-frame {
    flex: 1;
    width: 100%;
    border: 0;
    border-radius: 15px;
    background: white;
}

/* SETTINGS */

.settings {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 600;
    background: rgba(0,0,0,.6);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.settings.open {
    display: flex;
}

.settings-box {
    width: 450px;
    max-width: 100%;
    background: var(--card);
    color: var(--text);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

.settings-box h2 {
    margin-top: 0;
}

.setting {
    padding: 17px 0;
    border-bottom: 1px solid var(--border);
}

.setting:last-child {
    border-bottom: 0;
}

.setting-title {
    font-weight: bold;
    margin-bottom: 8px;
}

.setting button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 13px;
    cursor: pointer;
}

input[type="range"] {
    width: 100%;
}

/* TOAST */

.toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%) translateY(100px);
    background: #202126;
    color: white;
    padding: 12px 17px;
    border-radius: 12px;
    z-index: 1000;
    transition: .25s;
}

.toast.show {
    transform: translateX(-50%) translateY(0);
}

/* EMPTY */

.empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
}

/* MOBILE */

@media(max-width:1100px) {
    .games {
        grid-template-columns: repeat(4,1fr);
    }

    .games.small {
        grid-template-columns: repeat(5,1fr);
    }

    .games.large {
        grid-template-columns: repeat(3,1fr);
    }
}

@media(max-width:800px) {
    .games,
    .games.small,
    .games.large {
        grid-template-columns: repeat(2,1fr);
    }

    .title {
        display: none;
    }

    .hero h1 {
        font-size: 27px;
    }

    .thumbnail {
        height: 125px;
    }
}

@media(max-width:450px) {
    .header-inner {
        padding: 10px;
    }

    .container,
    .hero,
    .nav {
        padding-left: 10px;
        padding-right: 10px;
    }

    .games,
    .games.small,
    .games.large {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

let category = "All Games";

let favorites =
JSON.parse(localStorage.getItem("winyates-favorites") || "[]");

let recent =
JSON.parse(localStorage.getItem("winyates-recent") || "[]");


/* =========================
   DISPLAY GAMES
========================= */

function displayGames() {

    const box = document.getElementById("games");

    const search =
        document.getElementById("search").value.toLowerCase();

    let filtered = games.filter(game => {

        const title = game[0].toLowerCase();
        const cat = game[1];

        const matchesSearch =
            title.includes(search);

        let matchesCategory = true;

        if(category !== "All Games" &&
           category !== "Favorites") {

            matchesCategory = cat === category;

        }

        if(category === "Favorites") {

            matchesCategory =
                favorites.includes(game[2]);

        }

        return matchesSearch && matchesCategory;

    });


    box.innerHTML = "";


    if(filtered.length === 0) {

        box.innerHTML = `
        <div class="empty">
            <h2>No games found</h2>
            <p>Try another search.</p>
        </div>
        `;

        return;
    }


    filtered.forEach(game => {

        const title = game[0];
        const cat = game[1];
        const slug = game[2];
        const icon = game[3];

        const isFavorite =
            favorites.includes(slug);


        const card =
        document.createElement("div");

        card.className = "game";

        card.onclick = () =>
            playGame(title,slug);


        card.innerHTML = `

            <div class="thumbnail">
                ${icon}
            </div>

            <button
                class="favorite"
                onclick="event.stopPropagation(); toggleFavorite('${slug}')">
                ${isFavorite ? "★" : "☆"}
            </button>

            <div class="game-info">

                <div class="game-title">
                    ${title}
                </div>

                <div class="game-category">
                    ${cat}
                </div>

            </div>

            <button
                class="play"
                onclick="event.stopPropagation(); playGame('${title}','${slug}')">
                ▶
            </button>
        `;


        box.appendChild(card);

    });


    document.getElementById("gameCount").textContent =
        filtered.length;
}


/* =========================
   PLAY GAME
========================= */

function playGame(title,slug) {

    document.getElementById("playerTitle").textContent =
        title;

    const frame =
        document.getElementById("gameFrame");

    /*
       IMPORTANT:
       Games are loaded from YOUR repository.
       Example:
       games/slope/index.html
    */

    frame.src =
        "./games/" + slug + "/index.html";


    document.getElementById("player")
        .classList.add("open");


    addRecent(slug);

}


/* =========================
   CLOSE GAME
========================= */

function closeGame() {

    document.getElementById("player")
        .classList.remove("open");

    document.getElementById("gameFrame").src =
        "about:blank";
}


/* =========================
   FULLSCREEN
========================= */

function fullscreenGame() {

    const frame =
        document.getElementById("gameFrame");

    if(frame.requestFullscreen) {
        frame.requestFullscreen();
    }

}


/* =========================
   SEARCH
========================= */

document.getElementById("search")
.addEventListener("input",displayGames);


/* =========================
   CATEGORY
========================= */

function setCategory(cat,button) {

    category = cat;

    document
        .querySelectorAll(".nav button")
        .forEach(b =>
            b.classList.remove("active")
        );

    button.classList.add("active");

    displayGames();
}


/* =========================
   FAVORITES
========================= */

function toggleFavorite(slug) {

    if(favorites.includes(slug)) {

        favorites =
            favorites.filter(x => x !== slug);

        showToast("Removed from favorites");

    } else {

        favorites.push(slug);

        showToast("Added to favorites");

    }


    localStorage.setItem(
        "winyates-favorites",
        JSON.stringify(favorites)
    );


    displayGames();
}


/* =========================
   RECENT
========================= */

function addRecent(slug) {

    recent =
        recent.filter(x => x !== slug);

    recent.unshift(slug);

    recent =
        recent.slice(0,10);

    localStorage.setItem(
        "winyates-recent",
        JSON.stringify(recent)
    );

}


/* =========================
   SETTINGS
========================= */

function openSettings() {

    document
        .getElementById("settings")
        .classList.add("open");

}


function closeSettings(event) {

    if(event &&
       event.target !==
       document.getElementById("settings")) {

        return;
    }

    document
        .getElementById("settings")
        .classList.remove("open");

}


/* =========================
   DARK MODE
========================= */

function toggleDark() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "winyates-dark",
        document.body.classList.contains("dark")
    );

}


if(localStorage.getItem("winyates-dark") === "true") {

    document.body.classList.add("dark");

}


/* =========================
   VOLUME
========================= */

function changeVolume(value) {

    document.getElementById("volumeText")
        .textContent = value + "%";

    localStorage.setItem(
        "winyates-volume",
        value
    );

}


/* =========================
   CARD SIZE
========================= */

function setCardSize(size) {

    const box =
        document.getElementById("games");

    box.classList.remove(
        "small",
        "large"
    );

    if(size === "small")
        box.classList.add("small");

    if(size === "large")
        box.classList.add("large");

    localStorage.setItem(
        "winyates-card-size",
        size
    );

}


/* =========================
   TOAST
========================= */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    },2000);

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown",function(e) {

    if(e.key === "/") {

        e.preventDefault();

        document
            .getElementById("search")
            .focus();

    }

    if(e.key === "Escape") {

        closeGame();

        document
            .getElementById("settings")
            .classList.remove("open");

    }

});


/* =========================
   START
========================= */

const savedVolume =
localStorage.getItem("winyates-volume");

if(savedVolume !== null) {

    document.getElementById("volume").value =
        savedVolume;

    document.getElementById("volumeText").textContent =
        savedVolume + "%";

}


const savedSize =
localStorage.getItem("winyates-card-size");

if(savedSize) {

    setTimeout(() =>
        setCardSize(savedSize),0);

}


displayGames();

</script>

</body>
</html>
