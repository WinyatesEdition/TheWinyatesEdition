<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline HTML5 Arcade</title>
<style>
    :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --accent-color: #3b82f6;
        --text-color: #f8fafc;
        --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; }
    
    header { background-color: var(--card-bg); padding: 1rem 2rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent-color); }
    
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; width: 100%; flex: 1; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
    
    .card { background-color: var(--card-bg); border-radius: 8px; border: 1px solid #334155; overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { transform: translateY(-4px); border-color: var(--accent-color); }
    .card-body { padding: 1.25rem; }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
    .card-desc { font-size: 0.875rem; color: var(--text-muted); }
    
    .modal { display: none; position: fixed; inset: 0; background-color: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 1rem; }
    .modal.active { display: flex; }
    .modal-content { background-color: var(--card-bg); border-radius: 8px; width: 100%; max-width: 640px; border: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { padding: 1rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: none; border: none; color: var(--text-color); font-size: 1.5rem; cursor: pointer; }
    
    .game-viewport { width: 100%; height: 400px; background-color: #000; display: flex; justify-content: center; align-items: center; }
    canvas { background-color: #000; display: block; }
</style>
</head>
<body>

<header>
    <h1>Offline Canvas Arcade</h1>
</header>

<main class="container">
    <div class="grid">
        <div class="card" onclick="launchGame('snake')">
            <div class="card-body">
                <div class="card-title">Classic Snake</div>
                <div class="card-desc">Navigate the grid, collect food, and avoid colliding with walls or yourself.</div>
            </div>
        </div>
        <div class="card" onclick="launchGame('pong')">
            <div class="card-body">
                <div class="card-title">Pong Solo</div>
                <div class="card-desc">Keep the ball in play using the paddle and score points against the wall.</div>
            </div>
        </div>
    </div>
</main>

<div id="gameModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Game</h2>
            <button class="close-btn" onclick="closeGame()">&times;</button>
        </div>
        <div class="game-viewport">
            <canvas id="gameCanvas" width="600" height="380"></canvas>
        </div>
    </div>
</div>

<script>
let currentGameLoop = null;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function launchGame(gameType) {
    document.getElementById('gameModal').classList.add('active');
    if (currentGameLoop) clearInterval(currentGameLoop);
    
    if (gameType === 'snake') {
        document.getElementById('modalTitle').textContent = 'Classic Snake';
        runSnake();
    } else if (gameType === 'pong') {
        document.getElementById('modalTitle').textContent = 'Pong Solo';
        runPong();
    }
}

function closeGame() {
    document.getElementById('gameModal').classList.remove('active');
    if (currentGameLoop) clearInterval(currentGameLoop);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// --- SNAKE GAME ENGINE ---
function runSnake() {
    const gridSize = 20;
    const tileCountX = canvas.width / gridSize;
    const tileCountY = canvas.height / gridSize;
    
    let snake = [{x: 10, y: 10}];
    let food = {x: 15, y: 10};
    let dx = 1, dy = 0;
    
    function handleInput(e) {
        if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
        if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
        if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
        if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
    }
    
    document.addEventListener('keydown', handleInput);
    
    currentGameLoop = setInterval(() => {
        const head = {x: snake[0].x + dx, y: snake[0].y + dy};
        
        // Wall Collision
        if (head.x < 0 || head.x >= tileCountX || head.y < 0 || head.y >= tileCountY) {
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            return;
        }
        
        // Self Collision
        for (let segment of snake) {
            if (head.x === segment.x && head.y === segment.y) {
                snake = [{x: 10, y: 10}];
                dx = 1; dy = 0;
                return;
            }
        }
        
        snake.unshift(head);
        
        // Food Collision
        if (head.x === food.x && head.y === food.y) {
            food = {
                x: Math.floor(Math.random() * tileCountX),
                y: Math.floor(Math.random() * tileCountY)
            };
        } else {
            snake.pop();
        }
        
        // Render
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        
        ctx.fillStyle = '#22c55e';
        for (let segment of snake) {
            ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
        }
    }, 100);
}

// --- PONG GAME ENGINE ---
function runPong() {
    let paddleY = canvas.height / 2 - 40;
    const paddleHeight = 80;
    const paddleWidth = 10;
    
    let ballX = canvas.width / 2;
    let ballY = canvas.height / 2;
    let ballSpeedX = 4;
    let ballSpeedY = 4;
    
    function handleMouseMove(e) {
        const rect = canvas.getBoundingClientRect();
        paddleY = e.clientY - rect.top - paddleHeight / 2;
    }
    
    canvas.addEventListener('mousemove', handleMouseMove);
    
    currentGameLoop = setInterval(() => {
        ballX += ballSpeedX;
        ballY += ballSpeedY;
        
        // Top/Bottom bounce
        if (ballY <= 0 || ballY >= canvas.height) ballSpeedY = -ballSpeedY;
        
        // Right wall bounce
        if (ballX >= canvas.width) ballSpeedX = -ballSpeedX;
        
        // Paddle collision
        if (ballX <= paddleWidth + 10 && ballY >= paddleY && ballY <= paddleY + paddleHeight) {
            ballSpeedX = -ballSpeedX;
        }
        
        // Miss (Reset)
        if (ballX <= 0) {
            ballX = canvas.width / 2;
            ballY = canvas.height / 2;
            ballSpeedX = 4;
        }
        
        // Render
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#3b82f6';
        ctx.fillRect(10, paddleY, paddleWidth, paddleHeight);
        
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(ballX, ballY, 8, 0, Math.PI * 2);
        ctx.fill();
    }, 1000 / 60);
}
</script>
</body>
</html>
